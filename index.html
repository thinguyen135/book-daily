<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ nhật ký</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Patrick+Hand&display=swap">
<style>
:root {
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  --ui: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --hand: 'Patrick Hand', 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive;
  --pw: 380px;
  --lh: calc(var(--pw) * 0.072);

  --bg: #dfe8dc;
  --mat: #a7c2aa;
  --mat-line: rgba(255, 255, 255, 0.28);
  --mat-line-strong: rgba(255, 255, 255, 0.5);
  --mat-tick: rgba(20, 45, 30, 0.45);
  --on-mat: #1d3526;

  --bar-bg: #f3f7f1;
  --bar-fg: #1d2b21;
  --bar-muted: #566a5c;
  --bar-line: #c4d3c4;
  --btn-bg: #1f2a22;
  --btn-bg-hover: #2f3d33;
  --btn-fg: #fff0a0;

  --cloth: #7a3a31;
  --cloth-hi: #93493e;
  --cloth-lo: #5a2a24;
  --gold: #f0d79a;
  --gold-soft: rgba(240, 215, 154, 0.48);
  --ribbon: #b9382e;
  --paper: #fbf8ee;
  --rule: rgba(72, 112, 178, 0.26);
  --margin: rgba(205, 66, 66, 0.56);
  --ink: #2f2a1c;
  --ink-write: #2f2a1c;
  --ink-soft: rgba(47, 42, 28, 0.48);
  --endpaper: #e6d9bb;
  --endpaper-line: rgba(120, 80, 40, 0.18);
  --spine-shade: rgba(40, 25, 10, 0.22);
  --pill-bg: rgba(255, 224, 70, 0.85);
  --pill-fg: #2f2a1c;
  --nhan-bg: #fffdf6;
  --nhan-line: #b6463b;

  --frame: #fffffb;
  --frame-edge: rgba(60, 50, 20, 0.16);
  --cap-ink: #3a3320;
  --cap-ph: rgba(58, 51, 32, 0.4);
  --tape: rgba(255, 224, 70, 0.86);
  --photo-bg: #cfd6cc;
  --ctl-bg: rgba(20, 30, 24, 0.76);
  --ctl-fg: #ffffff;
  --shadow-book: 0 4px 12px rgba(25, 40, 28, 0.28), 0 22px 38px -8px rgba(25, 40, 28, 0.52);
  --shadow-photo: 0 1px 1px rgba(30, 20, 5, 0.25), 0 4px 8px -3px rgba(30, 20, 5, 0.35);
  --shadow-lift: 0 2px 4px rgba(25, 40, 28, 0.2), 0 22px 30px -10px rgba(25, 40, 28, 0.5);
  --focus: #0b3d27;
  --drop-line: rgba(29, 53, 38, 0.8);

  --toast-bg: #1f2a22;
  --toast-fg: #f3f7f1;
  --toast-link: #fff0a0;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a15;
    --mat: #1a2a21;
    --mat-line: rgba(255, 255, 255, 0.045);
    --mat-line-strong: rgba(255, 255, 255, 0.09);
    --mat-tick: rgba(235, 255, 240, 0.35);
    --on-mat: #b7cbbb;
    --bar-bg: #15201a;
    --bar-fg: #e6efe7;
    --bar-muted: #93a898;
    --bar-line: #26372c;
    --btn-bg: #ffe96b;
    --btn-bg-hover: #fff08a;
    --btn-fg: #2b2410;
    --cloth: #5d2b26;
    --cloth-hi: #703630;
    --cloth-lo: #431f1b;
    --paper: #ebe5d5;
    --rule: rgba(72, 112, 178, 0.32);
    --margin: rgba(190, 60, 60, 0.62);
    --ink: #2a2618;
    --ink-soft: rgba(42, 38, 24, 0.52);
    --endpaper: #cdbf9c;
    --spine-shade: rgba(30, 18, 6, 0.3);
    --nhan-bg: #f1ecdc;
    --frame: #efebda;
    --frame-edge: rgba(0, 0, 0, 0.25);
    --cap-ink: #2e2a1c;
    --cap-ph: rgba(46, 42, 28, 0.46);
    --tape: rgba(247, 212, 64, 0.9);
    --photo-bg: #b9bfb2;
    --shadow-book: 0 6px 14px rgba(0, 0, 0, 0.48), 0 26px 42px -8px rgba(0, 0, 0, 0.72);
    --shadow-photo: 0 1px 1px rgba(0, 0, 0, 0.35), 0 4px 8px -3px rgba(0, 0, 0, 0.5);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.45), 0 24px 32px -10px rgba(0, 0, 0, 0.7);
    --focus: #ffe96b;
    --drop-line: rgba(255, 233, 107, 0.9);
    --toast-bg: #e6efe7;
    --toast-fg: #15201a;
    --toast-link: #6b4e00;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #121a15;
  --mat: #1a2a21;
  --mat-line: rgba(255, 255, 255, 0.045);
  --mat-line-strong: rgba(255, 255, 255, 0.09);
  --mat-tick: rgba(235, 255, 240, 0.35);
  --on-mat: #b7cbbb;
  --bar-bg: #15201a;
  --bar-fg: #e6efe7;
  --bar-muted: #93a898;
  --bar-line: #26372c;
  --btn-bg: #ffe96b;
  --btn-bg-hover: #fff08a;
  --btn-fg: #2b2410;
  --cloth: #5d2b26;
  --cloth-hi: #703630;
  --cloth-lo: #431f1b;
  --paper: #ebe5d5;
  --rule: rgba(72, 112, 178, 0.32);
  --margin: rgba(190, 60, 60, 0.62);
  --ink: #2a2618;
  --ink-soft: rgba(42, 38, 24, 0.52);
  --endpaper: #cdbf9c;
  --spine-shade: rgba(30, 18, 6, 0.3);
  --nhan-bg: #f1ecdc;
  --frame: #efebda;
  --frame-edge: rgba(0, 0, 0, 0.25);
  --cap-ink: #2e2a1c;
  --cap-ph: rgba(46, 42, 28, 0.46);
  --tape: rgba(247, 212, 64, 0.9);
  --photo-bg: #b9bfb2;
  --shadow-book: 0 6px 14px rgba(0, 0, 0, 0.48), 0 26px 42px -8px rgba(0, 0, 0, 0.72);
  --shadow-photo: 0 1px 1px rgba(0, 0, 0, 0.35), 0 4px 8px -3px rgba(0, 0, 0, 0.5);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.45), 0 24px 32px -10px rgba(0, 0, 0, 0.7);
  --focus: #ffe96b;
  --drop-line: rgba(255, 233, 107, 0.9);
  --toast-bg: #e6efe7;
  --toast-fg: #15201a;
  --toast-link: #6b4e00;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; padding: 0; }
img { max-width: 100%; }
[hidden]:not([hidden="until-found" i]) { display: none !important; }

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--bar-fg);
  font: 14px var(--ui);
}
body.dragging { user-select: none; -webkit-user-select: none; }

/* Thanh công cụ */
.bar {
  flex: none;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bar-bg);
  border-bottom: 1px solid var(--bar-line);
}
.bar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo {
  position: relative;
  flex: none;
  width: 24px;
  height: 28px;
  border-radius: 2px 5px 5px 2px;
  background: linear-gradient(90deg, var(--cloth-lo) 0 5px, var(--cloth) 5px);
  box-shadow: 0 2px 4px rgba(25, 40, 28, 0.3);
  rotate: -5deg;
}
.logo::before {
  content: "";
  position: absolute;
  left: 9px;
  top: 6px;
  width: 10px;
  height: 11px;
  border-radius: 1px;
  background: var(--nhan-bg);
  box-shadow: inset 0 -3px 0 var(--rule), inset 0 -6px 0 var(--rule);
}
.logo::after {
  content: "";
  position: absolute;
  right: 3px;
  bottom: -4px;
  width: 4px;
  height: 7px;
  background: var(--ribbon);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%);
}
.brand-t { min-width: 0; }
h1 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.2; }
.count {
  margin: 2px 0 0;
  font-size: 12.5px;
  line-height: 1.2;
  color: var(--bar-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tools { flex: none; display: flex; align-items: center; gap: 8px; }
.ink-bar {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 38px;
  padding: 0 9px;
  border: 1px solid var(--bar-line);
  border-radius: 8px;
  background: transparent;
}
.ink-dot {
  width: 18px;
  height: 18px;
  padding: 0;
  border: 2px solid transparent;
  border-radius: 50%;
  background: var(--c);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.ink-dot:hover { transform: scale(1.14); }
.ink-dot[aria-pressed="true"] {
  box-shadow: 0 0 0 2px var(--bar-bg), 0 0 0 4px var(--c);
  transform: scale(1.06);
}
.ink-dot:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-width: 38px;
  height: 38px;
  padding: 0 12px;
  border: 1px solid var(--bar-line);
  border-radius: 8px;
  background: transparent;
  color: var(--bar-fg);
  font: 600 13.5px/1 var(--ui);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.14s ease;
}
.btn:hover { background: var(--bar-line); }
.btn[aria-pressed="true"] { background: var(--bar-line); }
.btn.primary { border-color: transparent; background: var(--btn-bg); color: var(--btn-fg); }
.btn.primary:hover { background: var(--btn-bg-hover); }
.btn.icon-only { padding: 0; width: 38px; }
.btn:active { translate: 0 1px; }
.btn:focus-visible,
.pager button:focus-visible,
.toast button:focus-visible,
.addtile:focus-visible,
.endadd:focus-visible,
.mood-btn:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

@media (max-width: 780px) {
  .ink-bar { padding: 0 6px; gap: 4px; }
  .ink-dot { width: 15px; height: 15px; }
}
@media (max-width: 520px) {
  .ink-bar { display: none; }
}
@media (max-width: 640px) {
  .btn .t.opt { display: none; }
  .btn { padding: 0 10px; }
}

/* Mặt bàn */
.stage {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  background:
    linear-gradient(var(--mat-line-strong) 1px, transparent 1px) 0 0 / 120px 120px,
    linear-gradient(90deg, var(--mat-line-strong) 1px, transparent 1px) 0 0 / 120px 120px,
    linear-gradient(var(--mat-line) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, var(--mat-line) 1px, transparent 1px) 0 0 / 24px 24px,
    var(--mat);
}
body.tray-open .stage { padding-bottom: 6px; }
.stage::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 12px;
  pointer-events: none;
  background:
    repeating-linear-gradient(90deg, var(--mat-tick) 0 1px, transparent 1px 12px) left bottom / 100% 5px no-repeat,
    repeating-linear-gradient(90deg, var(--mat-tick) 0 1px, transparent 1px 60px) left bottom / 100% 11px no-repeat;
}
.shelf {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 14px;
  overflow: visible;
}
.pager {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 44px;
}
.pager button {
  display: inline-grid;
  place-items: center;
  min-width: 34px;
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--bar-line);
  border-radius: 999px;
  background: var(--bar-bg);
  color: var(--bar-fg);
  font: 600 12.5px/1 var(--ui);
  cursor: pointer;
  transition: transform 0.14s ease, background-color 0.14s ease;
  -webkit-tap-highlight-color: transparent;
}
.pager button.round { width: 34px; padding: 0; }
.pager button:hover:not(:disabled) { transform: scale(1.05); background: var(--bar-line); }
.pager button:disabled { opacity: 0.38; cursor: default; }
#where {
  min-width: 15ch;
  text-align: center;
  font: 500 13px/1 var(--ui);
  color: var(--on-mat);
  font-variant-numeric: tabular-nums;
}

/* Turn.js Flipbook */
.book-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.36s cubic-bezier(0.25, 0.8, 0.25, 1);
  will-change: transform;
}
.book-wrap.at-front { transform: translateX(-25%); }
.book-wrap.at-back { transform: translateX(25%); }
.flipbook {
  position: relative;
  user-select: none;
  -webkit-user-select: none;
}
.flipbook .shadow {
  box-shadow: var(--shadow-book);
  border-radius: 5px;
  transition: width 0.3s ease, left 0.3s ease;
}
.flipbook .page-wrapper {
  perspective: 2200px;
  -webkit-perspective: 2200px;
}
.flipbook .page {
  --lh: calc(var(--pw) * 0.072);
  position: relative;
  overflow: hidden;
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent calc(var(--pw) * 0.1), var(--margin) calc(var(--pw) * 0.1), var(--margin) calc(var(--pw) * 0.1 + 1.5px), transparent calc(var(--pw) * 0.1 + 1.5px)),
    repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), var(--rule) calc(var(--lh) - 1px), var(--rule) var(--lh));
  box-shadow: inset 0 0 0 1px rgba(60, 45, 20, 0.08);
}
.flipbook .page::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
}
.flipbook .page.even::after {
  background: linear-gradient(to left, var(--spine-shade), transparent 14%);
}
.flipbook .page.odd::after,
.flipbook.is-single .page::after {
  background: linear-gradient(to right, var(--spine-shade), transparent 14%);
}
.flipbook .page.drop-here { outline: 3px dashed var(--drop-line); outline-offset: -6px; }

/* Bìa cứng (Turn.js .hard) */
.flipbook .hard {
  background-image: none;
  background: linear-gradient(145deg, var(--cloth-hi), var(--cloth) 55%, var(--cloth-lo));
  color: var(--gold);
  box-shadow: inset 0 0 18px rgba(25, 10, 5, 0.35);
}
.flipbook .hard.cover-front {
  border-radius: 0;
  cursor: pointer;
}
.flipbook .hard.cover-front::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: calc(var(--pw) * 0.075);
  background: linear-gradient(90deg, rgba(20, 8, 5, 0.45), rgba(255, 255, 255, 0.08) 55%, rgba(20, 8, 5, 0.38) 82%, transparent);
  pointer-events: none;
  z-index: 2;
}
.flipbook .hard.cover-front::after {
  background: none;
}
.flipbook .hard.cover-back {
  border-radius: 0;
  cursor: pointer;
}
.flipbook .hard.cover-back::before {
  content: "";
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: calc(var(--pw) * 0.075);
  background: linear-gradient(270deg, rgba(20, 8, 5, 0.45), rgba(255, 255, 255, 0.08) 55%, rgba(20, 8, 5, 0.38) 82%, transparent);
  pointer-events: none;
  z-index: 2;
}
.flipbook .hard.cover-back::after {
  background: none;
}

.cover-frame {
  position: absolute;
  inset: calc(var(--pw) * 0.065) calc(var(--pw) * 0.065) calc(var(--pw) * 0.065) calc(var(--pw) * 0.11);
  border: 2px solid var(--gold-soft);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: calc(var(--pw) * 0.07);
  text-align: center;
  box-shadow: inset 0 0 0 4px transparent, inset 0 0 0 5px rgba(240, 215, 154, 0.22);
}
.cover-back .cover-frame {
  inset: calc(var(--pw) * 0.065) calc(var(--pw) * 0.11) calc(var(--pw) * 0.065) calc(var(--pw) * 0.065);
}
.cover-kicker {
  font-size: max(10px, calc(var(--pw) * 0.032));
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold);
  opacity: 0.84;
}
.cover-orn {
  margin: calc(var(--pw) * 0.03) 0;
  font-size: max(16px, calc(var(--pw) * 0.06));
  color: var(--gold);
  opacity: 0.78;
}
.cover-title {
  margin: 0;
  font-family: var(--hand);
  font-size: max(26px, calc(var(--pw) * 0.12));
  line-height: 1.15;
  color: #fff6dc;
  text-shadow: 0 2px 6px rgba(25, 10, 5, 0.45);
  word-break: break-word;
}
.cover-sub {
  margin-top: calc(var(--pw) * 0.06);
  font-family: var(--hand);
  font-size: max(15px, calc(var(--pw) * 0.052));
  color: var(--gold);
  opacity: 0.88;
}
.cover-date {
  margin-top: calc(var(--pw) * 0.025);
  font-size: max(11px, calc(var(--pw) * 0.034));
  letter-spacing: 0.12em;
  color: var(--gold);
  opacity: 0.72;
}
.cover-hint {
  position: absolute;
  left: 12%;
  right: 12%;
  bottom: calc(var(--pw) * 0.055);
  font-size: max(11px, calc(var(--pw) * 0.033));
  color: rgba(255, 245, 215, 0.72);
  letter-spacing: 0.03em;
}
.cover-ribbon {
  position: absolute;
  right: calc(var(--pw) * 0.14);
  bottom: 0;
  width: calc(var(--pw) * 0.038);
  height: calc(var(--pw) * 0.11);
  background: linear-gradient(90deg, #9d2b22, var(--ribbon) 45%, #d64b3f 72%, #8f251d);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%);
  opacity: 0.92;
  pointer-events: none;
}

/* Mặt trong bìa trước & bìa sau */
.flipbook .hard.cover-inside-front,
.flipbook .hard.cover-inside-back {
  background-color: var(--endpaper);
  background-image:
    radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.24), transparent 55%),
    repeating-linear-gradient(45deg, var(--endpaper-line) 0 1px, transparent 1px calc(var(--pw) * 0.032));
  color: var(--ink);
  box-shadow: inset 0 0 0 6px var(--cloth);
}

.nhan {
  position: absolute;
  left: 11%;
  right: 11%;
  top: 19%;
  padding: calc(var(--pw) * 0.055) calc(var(--pw) * 0.055) calc(var(--pw) * 0.065);
  background: var(--nhan-bg);
  border: 3px double var(--nhan-line);
  border-radius: 4px;
  color: var(--ink);
  box-shadow: 0 2px 6px rgba(60, 30, 10, 0.22);
  user-select: text;
  -webkit-user-select: text;
}
.nhan-k {
  text-align: center;
  font-size: max(10px, calc(var(--pw) * 0.03));
  font-weight: 600;
  letter-spacing: 0.24em;
  color: var(--nhan-line);
}
.nhan-orn {
  text-align: center;
  margin-top: calc(var(--pw) * 0.012);
  font-size: max(10px, calc(var(--pw) * 0.03));
  color: var(--nhan-line);
  opacity: 0.65;
}
.nt, .nn, .nd {
  display: block;
  width: 100%;
  margin: 0;
  padding: 0 2px;
  border: 0;
  border-radius: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-family: var(--hand);
  min-height: 1.3em;
}
.nt {
  margin-top: calc(var(--pw) * 0.025);
  text-align: center;
  font-size: max(20px, calc(var(--pw) * 0.095));
  line-height: 1.18;
  border-bottom: 1px solid var(--ink-soft);
}
.nhan-r {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: calc(var(--pw) * 0.052);
}
.nhan-r span {
  flex: none;
  font-size: max(12px, calc(var(--pw) * 0.036));
  color: var(--ink-soft);
}
.nn, .nd {
  flex: 1;
  min-width: 0;
  font-size: max(16px, calc(var(--pw) * 0.05));
  line-height: 1.2;
  border-bottom: 1px dotted var(--ink-soft);
}
.nt:focus, .nn:focus, .nd:focus { background: rgba(255, 224, 70, 0.28); }
.nt::placeholder, .nn::placeholder, .nd::placeholder { color: var(--ink-soft); }

.nhan-tip {
  position: absolute;
  left: 12%;
  right: 12%;

  function visiblePageIds() {

  function whereText(view) {

    if (!spread) {

      if (a === tot) return 'Bìa sau';

    }
    if (a === 0 && b === 1) return 'Bìa trước';

    });

    pg.appendChild(head);

    var bodyEl;
    if (live) {
      bodyEl = el('textarea', 'diary-text');
      bodyEl.value = p.text || '';
      bodyEl.placeholder = 'Viết nhật ký hôm nay vào đây… (kéo góc trang để lật, thả hoặc Ctrl+V để dán ảnh)';
      bodyEl.spellcheck = false;
      bodyEl.setAttribute('lang', 'vi');
      bodyEl.setAttribute('aria-label', 'Nội dung nhật ký trang ' + (idx + 1));
      bodyEl.addEventListener('focus', function () { setActive(p.id); });
      bodyEl.addEventListener('input', function () {
        p.text = bodyEl.value;
        savePage(p);
        refreshThumb(p);
      });
    } else {
      bodyEl = el('div', 'diary-text is-static');
      bodyEl.textContent = p.text || '';
    }
    pg.appendChild(bodyEl);

    var items = el('div', 'items');
    p.items.slice().sort(function (a, b2) { return a.z - b2.z; }).forEach(function (n) {
      items.appendChild(buildItem(n, live));
    });
    pg.appendChild(items);

    if (live) {
      pg.dataset.pid = p.id;
      if (p.id === activeId) pg.classList.add('active');
      pg.addEventListener('pointerdown', function () { setActive(p.id); });
    }

    var foot = el('div', 'pfoot');
    foot.appendChild(el('span', 'pnum', String(idx + 1)));
    if (live && book.pages.length > 1) {
      var d = el('button', 'pdel', TRASH);
      d.type = 'button';
      d.setAttribute('aria-label', 'Bỏ trang ' + (idx + 1));
      d.addEventListener('click', function (e) { e.stopPropagation(); removePage(p.id); });
      foot.appendChild(d);
    }
    pg.appendChild(foot);
    return pg;
  }

  /* ---------- Ảnh dán trên trang ---------- */
  function raiseItem(n, f) {
    n.z = ++zTop;
    f.style.zIndex = n.z;
    savePageOf(n);
  }
  function pageElOf(f) { return f.closest('.page'); }
  function placePx(n, f, x, y) {
    var pe = pageElOf(f);
    if (!pe) return;
    var fr = toFrac(x, y, pe.clientWidth, pe.clientHeight, f.offsetWidth, f.offsetHeight);
    n.fx = fr.fx;
    n.fy = fr.fy;
    f.style.setProperty('--fx', n.fx);
    f.style.setProperty('--fy', n.fy);
  }
  function curPx(n, f) {
    var pe = pageElOf(f);
    return toPx(n.fx, n.fy, pe.clientWidth, pe.clientHeight, f.offsetWidth, f.offsetHeight);
  }
  function targetAt(x, y) {
    var list = document.elementsFromPoint(x, y);
    for (var i = 0; i < list.length; i++) {
      var t = list[i].closest ? list[i].closest('.page[data-pid], .thumb[data-pid]') : null;
      if (t) return t;
    }
    return null;
  }
  function markDrop(x, y) {
    var t = targetAt(x, y);
    if (t === dropMark) return;
    if (dropMark) dropMark.classList.remove('drop-here');
    dropMark = t;
    if (t) t.classList.add('drop-here');
  }
  function clearDrop() {
    if (dropMark) dropMark.classList.remove('drop-here');
    dropMark = null;
  }

  function buildItem(n, live) {
    var f = el('figure', 'photo' + (live ? ' live' : ''));
    f.dataset.iid = n.id;
    f.style.setProperty('--iw', n.w);
    f.style.setProperty('--ar', n.ar);
    f.style.setProperty('--fx', n.fx);
    f.style.setProperty('--fy', n.fy);
    f.style.setProperty('--r', n.r + 'deg');
    f.style.zIndex = n.z;
    f.innerHTML =
      '<span class="tape" aria-hidden="true"></span>' +
      '<div class="plate"><img alt="" draggable="false">' + (live ? SIZE_BTN : '') + '</div>' +
      (live ? '<input class="cap" type="text" maxlength="' + CAPLEN + '" spellcheck="false" lang="vi" placeholder="Thêm chú thích" aria-label="Chú thích ảnh">' : '<div class="cap"></div>') +
      (live ? DEL_BTN : '');
    var img = f.querySelector('img');
    img.src = n.src;
    var cap = f.querySelector('.cap');
    if (!live) { cap.textContent = n.cap; return f; }

    cap.value = n.cap;
    function label() {
      var t = n.cap ? 'Ảnh: ' + n.cap : 'Ảnh trên trang nhật ký';
      img.alt = t;
      f.setAttribute('aria-label', t);
    }
    f.tabIndex = 0;
    f.setAttribute('role', 'group');
    f.setAttribute('aria-description', 'Mũi tên để di chuyển, dấu cộng và dấu trừ để đổi cỡ, Delete để bỏ ảnh, Enter để sửa chú thích.');
    label();

    cap.addEventListener('input', function () {
      n.cap = cap.value;
      label();
      savePageOf(n);
      var loc = findItem(n.id);
      if (loc) refreshThumb(loc.page);
    });
    cap.addEventListener('focus', function () { f.classList.add('editing'); raiseItem(n, f); });
    cap.addEventListener('blur', function () { f.classList.remove('editing'); });
    cap.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); cap.blur(); f.focus(); }
    });
    f.querySelector('.del').addEventListener('click', function (e) { e.stopPropagation(); removeItem(n.id); });
    f.addEventListener('animationend', function () { f.classList.remove('is-new'); });

    var drag = null;
    f.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target.closest('.del') || e.target.closest('.size')) return;
      var onCap = e.target === cap;
      if (onCap && document.activeElement === cap) return;
      if (onCap && e.pointerType === 'mouse') e.preventDefault();
      e.stopPropagation();
      drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, active: false, ghost: null, x0: 0, y0: 0, gx: 0, gy: 0, nw: 0, nh: 0, lx: e.clientX, tilt: 0, focusCap: onCap && e.pointerType === 'mouse' };
      try { f.setPointerCapture(e.pointerId); } catch (err) {}
      raiseItem(n, f);
    });
    f.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.active) {
        if (Math.abs(dx) + Math.abs(dy) < 5) return;
        drag.active = true;
        var r = f.getBoundingClientRect();
        drag.nw = f.offsetWidth;
        drag.nh = f.offsetHeight;
        drag.x0 = r.left + r.width / 2 - drag.nw / 2;
        drag.y0 = r.top + r.height / 2 - drag.nh / 2;
        drag.ghost = buildItem(n, false);
        drag.ghost.classList.add('ghost');
        lift.appendChild(drag.ghost);
        f.classList.add('is-origin');
        document.body.classList.add('dragging');
      }
      drag.gx = drag.x0 + dx;
      drag.gy = drag.y0 + dy;
      drag.ghost.style.setProperty('--gx', drag.gx + 'px');
      drag.ghost.style.setProperty('--gy', drag.gy + 'px');
      var vx = e.clientX - drag.lx;
      drag.lx = e.clientX;
      drag.tilt += (clamp(vx * 0.7, -8, 8) - drag.tilt) * 0.3;
      drag.ghost.style.setProperty('--tilt', drag.tilt.toFixed(2) + 'deg');
      markDrop(e.clientX, e.clientY);
    });
    function endDrag(e) {
      if (!drag || e.pointerId !== drag.id) return;
      var d = drag;
      drag = null;
      if (!d.active) {
        if (d.focusCap && e.type === 'pointerup') cap.focus();
        return;
      }
      var t = e.type === 'pointerup' ? targetAt(e.clientX, e.clientY) : null;
      clearDrop();
      d.ghost.remove();
      document.body.classList.remove('dragging');
      f.classList.remove('is-origin');
      commitDrop(n, f, t, d);
    }
    f.addEventListener('pointerup', endDrag);
    f.addEventListener('pointercancel', endDrag);

    var rs = null;
    var sz = f.querySelector('.size');
    sz.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.stopPropagation();
      e.preventDefault();
      var p = curPx(n, f);
      rs = { id: e.pointerId, sx: e.clientX, sy: e.clientY, w0: n.w, pw: pageElOf(f).clientWidth, x0: p.x, y0: p.y };
      try { sz.setPointerCapture(e.pointerId); } catch (err) {}
      document.body.classList.add('dragging');
      raiseItem(n, f);
    });
    sz.addEventListener('pointermove', function (e) {
      if (!rs || e.pointerId !== rs.id) return;
      var dx = e.clientX - rs.sx, dy = (e.clientY - rs.sy) / (0.25 + 0.9 / n.ar);
      var d = Math.abs(dx) >= Math.abs(dy) ? dx : dy;
      n.w = clamp(rs.w0 + d / rs.pw, 0.2, maxW(n.ar));
      f.style.setProperty('--iw', n.w);
      placePx(n, f, rs.x0, rs.y0);
    });
    function endResize(e) {
      if (!rs || e.pointerId !== rs.id) return;
      rs = null;
      document.body.classList.remove('dragging');
      savePageOf(n);
      var loc = findItem(n.id);
      if (loc) refreshThumb(loc.page);
    }
    sz.addEventListener('pointerup', endResize);
    sz.addEventListener('pointercancel', endResize);

    f.addEventListener('keydown', function (e) {
      if (e.target !== f) return;
      var s = e.shiftKey ? STEP_BIG : STEP, dx = 0, dy = 0, dw = 0;
      switch (e.key) {
        case 'ArrowLeft': dx = -s; break;
        case 'ArrowRight': dx = s; break;
        case 'ArrowUp': dy = -s; break;
        case 'ArrowDown': dy = s; break;
        case '+': case '=': dw = 0.04; break;
        case '-': case '_': dw = -0.04; break;
        case 'Enter': e.preventDefault(); cap.focus(); return;
        case 'Delete': case 'Backspace': e.preventDefault(); removeItem(n.id); return;
        default: return;
      }
      e.preventDefault();
      e.stopPropagation();
      var p = curPx(n, f);
      if (dw) { n.w = clamp(n.w + dw, 0.2, maxW(n.ar)); f.style.setProperty('--iw', n.w); }
      placePx(n, f, p.x + dx, p.y + dy);
      raiseItem(n, f);
      var loc = findItem(n.id);
      if (loc) refreshThumb(loc.page);
    });
    return f;
  }

  function syncHasPhotos(page) {
    var pe = pageEl(page.id);
    if (pe) pe.classList.toggle('has-photos', page.items.length > 0);
  }

  function commitDrop(n, f, t, d) {
    var loc = findItem(n.id);
    if (!loc) return;
    var src = loc.page, dest = src, pe = null;
    if (t && t.classList.contains('page')) { pe = t; dest = pageById(t.dataset.pid) || src; }
    else if (t && t.classList.contains('thumb')) dest = pageById(t.dataset.pid) || src;
    else pe = pageElOf(f);
    if (pe) {
      var r = pe.getBoundingClientRect();
      var fr = toFrac(d.gx - r.left, d.gy - r.top, r.width, r.height, d.nw, d.nh);
      n.fx = fr.fx;
      n.fy = fr.fy;
    }
    n.z = ++zTop;
    f.style.zIndex = n.z;
    f.style.setProperty('--fx', n.fx);
    f.style.setProperty('--fy', n.fy);
    if (dest !== src) {
      src.items.splice(loc.idx, 1);
      dest.items.push(n);
      var destPe = pe || pageEl(dest.id);
      if (destPe) destPe.querySelector('.items').appendChild(f);
      else f.remove();
      syncHasPhotos(src);
      syncHasPhotos(dest);
      savePage(src);
      refreshThumb(src);
      if (!pe) showToast('Đã chuyển ảnh sang trang ' + (book.pages.indexOf(dest) + 1), null);
    }
    savePage(dest);
    refreshThumb(dest);
    updateChrome();
  }

  function removeItem(id) {
    var loc = findItem(id);
    if (!loc) return;
    var page = loc.page, n = loc.item;
    page.items.splice(loc.idx, 1);
    var pe = pageEl(page.id);
    if (pe) { var f = pe.querySelector('.photo[data-iid="' + id + '"]'); if (f) f.remove(); }
    syncHasPhotos(page);
    idbWrite(function (t) { t.objectStore('imgs').delete(id); });
    savePage(page);
    refreshThumb(page);
    updateChrome();
    showToast('Đã bỏ 1 ảnh', function () {
      var p = pageById(page.id) || book.pages[0];
      p.items.push(n);
      n.z = ++zTop;
      persistFullPage(p);
      var pe2 = pageEl(p.id);
      if (pe2) { var g = buildItem(n, true); g.classList.add('is-new'); pe2.querySelector('.items').appendChild(g); }
      syncHasPhotos(p);
      refreshThumb(p);
      updateChrome();
    });
  }

  /* ---------- Thêm ảnh ---------- */
  function readImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        URL.revokeObjectURL(url);
        if (!w || !h) return reject(new Error('empty'));
        var s = Math.min(1, MAXSIDE / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
        var c = document.createElement('canvas');
        c.width = cw;
        c.height = ch;
        var g = c.getContext('2d');
        g.fillStyle = '#ffffff';
        g.fillRect(0, 0, cw, ch);
        g.drawImage(img, 0, 0, cw, ch);
        resolve({ src: c.toDataURL('image/jpeg', QUALITY), w: cw, h: ch });
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
      img.src = url;
    });
  }
  function farSpot(page) {
    var best = { fx: 0.78, fy: 0.88 }, bestD = -1;
    for (var i = 0; i < 14; i++) {
      var fx = 0.08 + Math.random() * 0.86, fy = 0.6 + Math.random() * 0.36, d = Infinity;
      page.items.forEach(function (o) {
        var dd = Math.hypot(o.fx - fx, o.fy - fy);
        if (dd < d) d = dd;
      });
      if (d > bestD) { bestD = d; best = { fx: fx, fy: fy }; }
    }
    return best;
  }
  function addImageTo(page, img) {
    var spot = farSpot(page);
    var tilt = (1 + Math.random() * 3) * (Math.random() < 0.5 ? -1 : 1);
    var ar = fitAspect(img.w, img.h);
    var n = { id: newId('i'), src: img.src, ar: ar, w: defaultW(ar), fx: spot.fx, fy: spot.fy, r: Math.round(tilt * 10) / 10, z: ++zTop, cap: '' };
    page.items.push(n);
    idbWrite(function (t) { t.objectStore('imgs').put({ id: n.id, src: n.src }); });
    savePage(page);
    var pe = pageEl(page.id);
    if (pe) {
      var f = buildItem(n, true);
      f.classList.add('is-new');
      pe.querySelector('.items').appendChild(f);
      syncHasPhotos(page);
    } else if (turnReady) {
      // Nếu trang chưa hiển thị (ví dụ đang đóng bìa), tự mở sang trang vừa thêm ảnh
      var tp = diaryIdxToTurnPage(book.pages.indexOf(page));
      $(flipbookEl).turn('page', tp);
      setTimeout(function () {
        var peLater = pageEl(page.id);
        if (peLater && !peLater.querySelector('.photo[data-iid="' + n.id + '"]')) {
          var f2 = buildItem(n, true);
          f2.classList.add('is-new');
          peLater.querySelector('.items').appendChild(f2);
          syncHasPhotos(page);
        }
      }, 60);
    }
    refreshThumb(page);
    updateChrome();
  }
  var queue = Promise.resolve();
  function addFiles(fileList, page) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    var target = page || activePage();
    queue = queue.then(async function () {
      var failed = 0, full = false, added = 0;
      for (var i = 0; i < files.length; i++) {
        if (totalPhotos() >= MAXPHOTOS) { full = true; break; }
        if (!/^image\//.test(files[i].type)) { failed++; continue; }
        try { addImageTo(target, await readImage(files[i])); added++; } catch (e) { failed++; }
      }
      if (full) showToast('Sổ đã đầy (' + MAXPHOTOS + ' ảnh). Hãy bỏ bớt ảnh rồi thêm tiếp.', null);
      else if (failed) showToast('Không đọc được ' + failed + ' tệp. Hãy chọn ảnh JPG, PNG hoặc WebP.', null);
      else if (added && visiblePageIds().indexOf(target.id) < 0) showToast('Đã dán ảnh vào trang ' + (book.pages.indexOf(target) + 1), null);
    });
  }

  /* ---------- Dựng & điều khiển Turn.js Flipbook ---------- */
  function computeSize() {
    var sw = shelf.clientWidth || window.innerWidth;
    var sh = shelf.clientHeight || (window.innerHeight - 140);
    var padX = 24, padY = 16;
    var availH = Math.max(220, sh - 2 * padY);
    var pwTwo = Math.min((sw - 2 * padX) / 2, availH / RATIO);
    var pwOne = Math.min(sw - 2 * padX, availH / RATIO);
    var wantSpread = pwTwo >= 230;
    var nextPw = clamp(Math.floor(wantSpread ? pwTwo : pwOne), 180, 480);
    return {
      pw: nextPw,
      spread: wantSpread,
      bookW: wantSpread ? nextPw * 2 : nextPw,
      bookH: Math.round(nextPw * RATIO)
    };
  }

  function initFlipbook(startPage, flipToAfter) {
    closeMoodPop();
    if (turnReady) {
      try { $(flipbookEl).turn('destroy'); } catch (e) {}
      turnReady = false;
    }
    var fresh = el('div', 'flipbook');
    fresh.id = 'flipbook';
    bookWrap.replaceChildren(fresh);
    flipbookEl = fresh;

    var sz = computeSize();
    pw = sz.pw;
    spread = sz.spread;
    document.documentElement.style.setProperty('--pw', pw + 'px');
    flipbookEl.classList.toggle('is-single', !spread);

    // Dựng đầy đủ các trang cho Turn.js
    flipbookEl.appendChild(buildFrontCover());
    flipbookEl.appendChild(buildInsideFrontCover());
    book.pages.forEach(function (p, i) {
      flipbookEl.appendChild(buildDiaryPage(p, i, true));
    });
    var n = book.pages.length;
    if (n % 2 === 1) {
      flipbookEl.appendChild(buildEndPage(false));
      flipbookEl.appendChild(buildInsideBackCover(false));
    } else {
      flipbookEl.appendChild(buildInsideBackCover(true));
    }
    flipbookEl.appendChild(buildBackCover());

    var tot = totalTurnPages();
    curTurnPage = clamp(startPage || 1, 1, tot);

    $(flipbookEl).turn({
      width: sz.bookW,
      height: sz.bookH,
      display: spread ? 'double' : 'single',
      elevation: 50,
      gradients: true,
      autoCenter: false,
      acceleration: true,
      duration: 720,
      page: curTurnPage,
      when: {
        turning: function (e, page, view) {
          closeMoodPop();
          flush();
          curTurnPage = page;
          updateChrome(view);
        },
        turned: function (e, page, view) {
          curTurnPage = page;
          var vis = visiblePageIds();
          if (vis.length && vis.indexOf(activeId) < 0) activeId = vis[vis.length - 1];
          updateChrome(view);
          saveBookSoon();
        }
      }
    });
    turnReady = true;

    var vis0 = visiblePageIds();
    if (vis0.length && vis0.indexOf(activeId) < 0) activeId = vis0[vis0.length - 1];
    updateChrome();

    if (flipToAfter && flipToAfter !== curTurnPage) {
      requestAnimationFrame(function () {
        if (turnReady) $(flipbookEl).turn('page', clamp(flipToAfter, 1, totalTurnPages()));
      });
    }
  }

  function layout() {
    if (!turnReady) return;
    var sz = computeSize();
    var modeChanged = sz.spread !== spread;
    var sizeChanged = Math.abs(sz.pw - pw) >= 2;
    if (!modeChanged && !sizeChanged) return;
    pw = sz.pw;
    spread = sz.spread;
    document.documentElement.style.setProperty('--pw', pw + 'px');
    flipbookEl.classList.toggle('is-single', !spread);
    try {
      if (modeChanged) $(flipbookEl).turn('display', spread ? 'double' : 'single');
      $(flipbookEl).turn('size', sz.bookW, sz.bookH);
    } catch (e) {}
    updateChrome();
  }

  /* ---------- Quản lý trang: thêm, bỏ, đổi thứ tự ---------- */
  function setActive(id) {
    if (activeId === id) return;
    activeId = id;
    updateChrome();
  }

  function addPage(at, animateFlip) {
    flush();
    var prevTurn = curTurnPage;
    var p = {
      id: newId('pg'),
      date: formatViDate(new Date()),
      title: '',
      mood: '',
      text: '',
      items: []
    };
    var i = at == null ? book.pages.length : at;
    book.pages.splice(i, 0, p);
    activeId = p.id;
    savePageNow(p);
    refreshTray();
    var targetTurn = diaryIdxToTurnPage(i);
    if (animateFlip) {
      initFlipbook(clamp(prevTurn, 1, totalTurnPages()), targetTurn);
    } else {
      initFlipbook(targetTurn);
    }
    saveBookSoon();
  }

  function removePage(id) {
    if (book.pages.length < 2) return;
    flush();
    var idx = -1;
    book.pages.forEach(function (p, i) { if (p.id === id) idx = i; });
    if (idx < 0) return;
    var p = book.pages.splice(idx, 1)[0];
    delete dirty[id];
    idbWrite(function (t) {
      t.objectStore('pages').delete(id);
      p.items.forEach(function (n) { t.objectStore('imgs').delete(n.id); });
    });
    var nextIdx = Math.min(idx, book.pages.length - 1);
    activeId = book.pages[nextIdx].id;
    refreshTray();
    initFlipbook(diaryIdxToTurnPage(nextIdx));
    saveBookSoon();
    showToast('Đã bỏ trang ' + (idx + 1), function () {
      book.pages.splice(Math.min(idx, book.pages.length), 0, p);
      persistFullPage(p);
      activeId = p.id;
      refreshTray();
      initFlipbook(diaryIdxToTurnPage(book.pages.indexOf(p)));
      saveBookSoon();
    });
  }

  function movePage(from, to) {
    if (from === to || to < 0 || to >= book.pages.length) return;
    flush();
    var p = book.pages[from];
    book.pages = moveItem(book.pages, from, to);
    activeId = p.id;
    refreshTray();
    initFlipbook(diaryIdxToTurnPage(book.pages.indexOf(p)));
    saveBookSoon();
  }

  function go(delta) {
    if (!turnReady) return;
    if (delta > 0) $(flipbookEl).turn('next');
    else $(flipbookEl).turn('previous');
  }
  function goToPage(i) {
    var p = book.pages[i];
    if (!p || !turnReady) return;
    activeId = p.id;
    $(flipbookEl).turn('page', diaryIdxToTurnPage(i));
    updateChrome();
  }

  function updateChrome(viewOverride) {
    var n = book.pages.length;
    var tot = totalTurnPages();
    var view = viewOverride || currentViewPages();
    var ph = totalPhotos();
    countEl.textContent = n + ' trang' + (ph ? ' · ' + ph + ' ảnh' : '');
    whereEl.textContent = whereText(view);
    prevBtn.disabled = curTurnPage <= 1;
    nextBtn.disabled = curTurnPage >= tot;
    coverBtn.disabled = curTurnPage === 1;
    bookWrap.classList.toggle('at-front', spread && view[0] === 0 && view[1] === 1);
    bookWrap.classList.toggle('at-back', spread && view[0] === tot && view[1] === 0);

    flipbookEl.querySelectorAll('.page[data-pid]').forEach(function (p) {
      p.classList.toggle('active', p.dataset.pid === activeId);
    });

    var vis = [];
    view.forEach(function (tp) {
      var idx = turnPageToDiaryIdx(tp);
      if (idx >= 0 && book.pages[idx]) vis.push(book.pages[idx].id);
    });
    var first = null;
    tray.querySelectorAll('.thumb').forEach(function (th) {
      var on = vis.indexOf(th.dataset.pid) >= 0;
      th.classList.toggle('current', on);
      if (on && !first) first = th;
    });
    if (first) revealThumb(first);
    var ap = activePage();
    addImgBtn.title = ap ? 'Thêm ảnh vào trang ' + (book.pages.indexOf(ap) + 1) : 'Thêm ảnh';
  }

  /* ---------- Hàng trang thu nhỏ ---------- */
  function revealThumb(th) {
    var l = th.offsetLeft, r = l + th.offsetWidth;
    if (l < tray.scrollLeft) tray.scrollLeft = Math.max(0, l - 12);
    else if (r > tray.scrollLeft + tray.clientWidth) tray.scrollLeft = r - tray.clientWidth + 12;
  }
  function refreshThumb(p) {
    clearTimeout(thumbTimers[p.id]);
    thumbTimers[p.id] = setTimeout(function () {
      var mini = tray.querySelector('.thumb[data-pid="' + p.id + '"] .mini');
      if (mini) mini.replaceChildren(buildDiaryPage(p, book.pages.indexOf(p), false));
    }, 180);
  }
  var ins = el('div', 'ins');
  ins.hidden = true;

  function buildThumb(p, i) {
    var th = el('div', 'thumb');
    th.dataset.pid = p.id;
    th.tabIndex = 0;
    th.setAttribute('role', 'listitem');
    th.setAttribute('aria-label', 'Trang ' + (i + 1) + '. Enter để mở, Alt và mũi tên để đổi chỗ, Delete để bỏ.');
    var mini = el('div', 'mini');
    mini.appendChild(buildDiaryPage(p, i, false));
    var foot = el('div', 'tfoot');
    foot.appendChild(el('span', 'grab', '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5.5 4v.01M10.5 4v.01M5.5 8v.01M10.5 8v.01M5.5 12v.01M10.5 12v.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>'));
    foot.appendChild(el('span', 'tn', String(i + 1)));
    var del = el('button', 'tdel', '<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>');
    del.type = 'button';
    del.setAttribute('aria-label', 'Bỏ trang ' + (i + 1));
    if (book.pages.length < 2) del.hidden = true;
    foot.appendChild(del);
    th.appendChild(mini);
    th.appendChild(foot);
    bindThumb(th, p);
    return th;
  }

  function bindThumb(th, p) {
    var st = null;
    th.querySelector('.tdel').addEventListener('click', function (e) { e.stopPropagation(); removePage(p.id); });
    th.addEventListener('click', function () {
      if (suppressClick) { suppressClick = false; return; }
      goToPage(book.pages.indexOf(p));
    });
    th.addEventListener('keydown', function (e) {
      if (e.target !== th) return;
      var i = book.pages.indexOf(p);
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goToPage(i); }
      else if (e.key === 'Delete') { e.preventDefault(); removePage(p.id); }
      else if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        e.preventDefault();
        movePage(i, i + (e.key === 'ArrowLeft' ? -1 : 1));
        var again = tray.querySelector('.thumb[data-pid="' + p.id + '"]');
        if (again) again.focus();
      }
    });
    th.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target.closest('.tdel')) return;
      if (e.pointerType !== 'mouse' && !e.target.closest('.grab')) return;
      st = { id: e.pointerId, sx: e.clientX, sy: e.clientY, active: false, ghost: null, gx0: 0, gy0: 0, to: -1 };
      try { th.setPointerCapture(e.pointerId); } catch (err) {}
    });
    th.addEventListener('pointermove', function (e) {
      if (!st || e.pointerId !== st.id) return;
      var dx = e.clientX - st.sx, dy = e.clientY - st.sy;
      if (!st.active) {
        if (Math.abs(dx) + Math.abs(dy) < 6) return;
        st.active = true;
        var r = th.getBoundingClientRect();
        st.gx0 = r.left;
        st.gy0 = r.top;
        st.ghost = el('div', 'thumb ghost-thumb');
        st.ghost.appendChild(th.querySelector('.mini').cloneNode(true));
        lift.appendChild(st.ghost);
        th.classList.add('dragging');
        document.body.classList.add('dragging');
      }
      st.ghost.style.setProperty('--gx', (st.gx0 + dx) + 'px');
      st.ghost.style.setProperty('--gy', (st.gy0 + dy) + 'px');
      var tr = tray.getBoundingClientRect();
      if (e.clientX < tr.left + 36) tray.scrollLeft -= 14;
      else if (e.clientX > tr.right - 36) tray.scrollLeft += 14;
      var others = Array.prototype.filter.call(tray.querySelectorAll('.thumb'), function (x) { return x !== th; });
      var to = 0;
      others.forEach(function (x) {
        var b = x.getBoundingClientRect();
        if (b.left + b.width / 2 < e.clientX) to++;
      });
      st.to = to;
      var ref = others[to] || others[others.length - 1];
      if (ref) {
        var rb = ref.getBoundingClientRect();
        var x = (others[to] ? rb.left - 7 : rb.right + 5) - tr.left + tray.scrollLeft;
        ins.style.left = x + 'px';
        ins.hidden = false;
      }
    });
    function endTh(e) {
      if (!st || e.pointerId !== st.id) return;
      var s = st;
      st = null;
      if (!s.active) return;
      suppressClick = true;
      setTimeout(function () { suppressClick = false; }, 0);
      s.ghost.remove();
      th.classList.remove('dragging');
      document.body.classList.remove('dragging');
      ins.hidden = true;
      if (e.type === 'pointerup' && s.to >= 0) movePage(book.pages.indexOf(p), s.to);
    }
    th.addEventListener('pointerup', endTh);
    th.addEventListener('pointercancel', endTh);
  }

  function refreshTray() {
    var kids = book.pages.map(function (p, i) { return buildThumb(p, i); });
    var add = el('button', 'addtile', '<svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span>Trang mới</span>');
    add.type = 'button';
    add.addEventListener('click', function () { addPage(null, true); });
    kids.push(add);
    kids.push(ins);
    tray.replaceChildren.apply(tray, kids);
  }
  function setTray(open, persist) {
    tray.hidden = !open;
    document.body.classList.toggle('tray-open', open);
    trayBtn.setAttribute('aria-pressed', open ? 'true' : 'false');
    if (persist) { try { localStorage.setItem('so-nhat-ky-tray', open ? '1' : '0'); } catch (e) {} }
    if (turnReady) setTimeout(layout, 20);
    if (open) updateChrome();
  }

  /* ---------- Ảnh mẫu lần mở đầu ---------- */
  function rng(seed) {
    var s = seed >>> 0;
    return function () { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
  }
  function paintScene(kind) {
    var dims = { dawn: [800, 600], night: [600, 800], sea: [700, 700] }[kind];
    var w = dims[0], h = dims[1];
    var c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    var g = c.getContext('2d'), R = rng(kind.length * 7919 + 17), grad, i;
    if (kind === 'dawn') {
      grad = g.createLinearGradient(0, 0, 0, h * 0.7);
      grad.addColorStop(0, '#5f86c0');
      grad.addColorStop(0.55, '#f2b58c');
      grad.addColorStop(1, '#ffe3a6');
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
      var sx = w * 0.68, sy = h * 0.58;
      var glow = g.createRadialGradient(sx, sy, 0, sx, sy, h * 0.42);
      glow.addColorStop(0, 'rgba(255,244,200,0.95)');
      glow.addColorStop(0.25, 'rgba(255,230,170,0.5)');
      glow.addColorStop(1, 'rgba(255,230,170,0)');
      g.fillStyle = glow;
      g.fillRect(0, 0, w, h);
      g.fillStyle = '#fff6d2';
      g.beginPath();
      g.arc(sx, sy, h * 0.07, 0, Math.PI * 2);
      g.fill();
      [[0.62, 0.05, 2.2, 0.4, '#7d9a78'], [0.72, 0.06, 1.7, 1.9, '#55805f'], [0.84, 0.07, 1.3, 3.1, '#2f5b48']].forEach(function (H) {
        g.fillStyle = H[4];
        g.beginPath();
        g.moveTo(0, h);
        for (var x = 0; x <= w; x += 8) {
          g.lineTo(x, h * (H[0] + H[1] * Math.sin(x / w * Math.PI * H[2] + H[3]) + H[1] * 0.4 * Math.sin(x / w * Math.PI * 5.3 + H[3] * 2)));
        }
        g.lineTo(w, h);
        g.closePath();
        g.fill();
      });
    } else if (kind === 'night') {
      grad = g.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#0a1030');
      grad.addColorStop(0.7, '#26397a');
      grad.addColorStop(1, '#46508f');
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
      for (i = 0; i < 160; i++) {
        g.fillStyle = 'rgba(255,255,240,' + (0.35 + R() * 0.65).toFixed(2) + ')';
        g.beginPath();
        g.arc(R() * w, R() * h * 0.8, 0.6 + R() * 1.6, 0, Math.PI * 2);
        g.fill();
      }
      var mx = w * 0.68, my = h * 0.24;
      var mg = g.createRadialGradient(mx, my, 0, mx, my, w * 0.32);
      mg.addColorStop(0, 'rgba(247,242,218,0.5)');
      mg.addColorStop(1, 'rgba(247,242,218,0)');
      g.fillStyle = mg;
      g.fillRect(0, 0, w, h);
      g.fillStyle = '#f7f2da';
      g.beginPath();
      g.arc(mx, my, w * 0.085, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = '#0b1424';
      for (i = 0; i < 9; i++) {
        var bx = (i + 0.5) * w / 9 + (R() - 0.5) * 30, bh = h * (0.16 + R() * 0.14), bw = bh * 0.55;
        for (var k = 0; k < 3; k++) {
          var ty = h - bh + k * bh * 0.25, tw = bw * (0.55 + k * 0.22);
          g.beginPath();
          g.moveTo(bx, ty);
          g.lineTo(bx + tw / 2, ty + bh * 0.42);
          g.lineTo(bx - tw / 2, ty + bh * 0.42);
          g.closePath();
          g.fill();
        }
      }
      g.fillRect(0, h * 0.94, w, h * 0.06);
    } else {
      var hz = h * 0.5;
      grad = g.createLinearGradient(0, 0, 0, hz);
      grad.addColorStop(0, '#7db8e0');
      grad.addColorStop(1, '#f4efe0');
      g.fillStyle = grad;
      g.fillRect(0, 0, w, hz);
      var ux = w * 0.5, uy = hz - h * 0.05;
      var sg = g.createRadialGradient(ux, uy, 0, ux, uy, h * 0.3);
      sg.addColorStop(0, 'rgba(255,250,225,1)');
      sg.addColorStop(0.2, 'rgba(255,240,190,0.55)');
      sg.addColorStop(1, 'rgba(255,240,190,0)');
      g.fillStyle = sg;
      g.fillRect(0, 0, w, hz);
      g.fillStyle = 'rgba(255,255,255,0.7)';
      [[0.22, 0.14, 0.2], [0.72, 0.2, 0.16], [0.5, 0.08, 0.12]].forEach(function (C) {
        for (var j = 0; j < 4; j++) {
          g.beginPath();
          g.ellipse(w * (C[0] + (j - 1.5) * 0.04), h * (C[1] + (j % 2) * 0.012), w * C[2] * (0.35 + 0.1 * (j % 3)), h * 0.025, 0, 0, Math.PI * 2);
          g.fill();
        }
      });
      grad = g.createLinearGradient(0, hz, 0, h);
      grad.addColorStop(0, '#2b7ca8');
      grad.addColorStop(1, '#0d3f66');
      g.fillStyle = grad;
      g.fillRect(0, hz, w, h - hz);
      for (i = 0; i < 26; i++) {
        var t = i / 26, y2 = hz + Math.pow(t, 1.6) * (h - hz), sw = w * 0.18 * (1 + t * 2.2) * (0.4 + R() * 0.6);
        g.fillStyle = 'rgba(255,244,210,' + (0.55 - i * 0.015).toFixed(3) + ')';
        g.fillRect(ux - sw / 2 + (R() - 0.5) * 20, y2, sw, 2 + i * 0.18);
      }
    }
    return { src: c.toDataURL('image/jpeg', 0.86), w: w, h: h };
  }
  function seedItem(kind, cap, fx, fy, r, w) {
    var p = paintScene(kind), ar = fitAspect(p.w, p.h);
    return { id: newId('i'), src: p.src, ar: ar, w: Math.min(w, maxW(ar)), fx: fx, fy: fy, r: r, z: ++zTop, cap: cap };
  }
  function makeSeedPages() {
    var today = new Date();
    var yest = new Date(today.getTime() - 86400000);
    return [
      {
        id: newId('pg'),
        date: formatViDate(yest),
        title: 'Buổi sáng bình yên',
        mood: 'sun',
        text: 'Hôm nay trời nắng nhẹ, mình dậy sớm pha tách cà phê nóng và ngắm bình minh qua cửa sổ.\n\nBạn có thể kéo góc trang để cảm nhận hiệu ứng lật cong như sách thật, hoặc bấm vào trang để viết tiếp!',
        items: [seedItem('dawn', 'Bình minh qua đồi', 0.84, 0.88, 2.3, 0.42)]
      },
      {
        id: newId('pg'),
        date: formatViDate(today),
        title: 'Chiều dạo biển & đêm trăng',
        mood: 'calm',
        text: 'Gió thổi mát rượi, sóng vỗ nhẹ từng nhịp đều đặn. Những lúc thế này chỉ muốn viết vài dòng thật chậm và lưu lại vài bức ảnh kỷ niệm.',
        items: [seedItem('sea', 'Biển chiều lặng gió', 0.2, 0.9, -2.4, 0.38), seedItem('night', 'Đêm trăng sáng', 0.88, 0.92, 2.1, 0.33)]
      },
      {
        id: newId('pg'),
        date: formatViDate(today),
        title: '',
        mood: '',
        text: '',
        items: []
      }
    ];
  }

  /* ---------- Khởi động ---------- */
  async function boot() {
    try { applyTheme(localStorage.getItem('so-nhat-ky-theme'), false); }
    catch (e) { applyTheme(null, false); }

    db = await openDB();
    var recs = await idbAll('pages');
    var imgs = await idbAll('imgs');
    var rec = await idbGet('meta', 'book');
    var seeded = await idbGet('meta', 'seeded');
    var map = {};
    imgs.forEach(function (r) { if (r && r.id) map[r.id] = r.src; });
    var byId = {};
    recs.forEach(function (r) { if (r && r.id) byId[r.id] = r; });
    var pages = [];
    if (rec && Array.isArray(rec.order)) {
      rec.order.forEach(function (id) {
        var r = byId[id];
        if (!r) return;
        var items = (Array.isArray(r.items) ? r.items : [])
          .filter(function (m) { return m && m.id && typeof map[m.id] === 'string'; })
          .map(function (m) { return cleanItem(m, map[m.id]); });
        pages.push({
          id: String(r.id),
          date: String(r.date || ''),
          title: String(r.title || ''),
          mood: String(r.mood || ''),
          text: String(r.text || ''),
          items: items
        });
      });
      if (rec.label && typeof rec.label === 'object') {
        book.label = {
          t: String(rec.label.t || '').slice(0, 36),
          n: String(rec.label.n || '').slice(0, 36),
          d: String(rec.label.d || '').slice(0, 36)
        };
      }
      if (rec.ink) applyInk(rec.ink, false);
    } else {
      applyInk(book.ink, false);
    }

    var startTurn = rec && +rec.turnPage >= 1 ? +rec.turnPage : 1;
    if (!pages.length && !seeded) {
      pages = makeSeedPages();
      pages.forEach(function (p) { persistFullPage(p); });
      idbWrite(function (t) { t.objectStore('meta').put(true, 'seeded'); });
      startTurn = 1; // Bắt đầu từ bìa cứng giống sách thật để mở ra
    }
    if (!pages.length) {
      pages = [{ id: newId('pg'), date: formatViDate(new Date()), title: '', mood: '', text: '', items: [] }];
      savePageNow(pages[0]);
    }
    book.pages = pages;
    zTop = 0;
    pages.forEach(function (p) { p.items.forEach(function (n) { zTop = Math.max(zTop, n.z); }); });
    activeId = pages[0].id;

    var open = false;
    try {
      var v = localStorage.getItem('so-nhat-ky-tray');
      open = v === null ? (innerHeight >= 760 && innerWidth >= 900) : v === '1';
    } catch (e) { open = innerHeight >= 760 && innerWidth >= 900; }
    setTray(open, false);

    refreshTray();
    initFlipbook(clamp(startTurn, 1, totalTurnPages()));
    saveBookNow();
    if (!db) storageFail();
  }

  /* ---------- Sự kiện thanh công cụ & bàn phím ---------- */
  addImgBtn.addEventListener('click', function () { fileIn.click(); });
  fileIn.addEventListener('change', function () {
    addFiles(fileIn.files, activePage());
    fileIn.value = '';
  });
  addPgBtn.addEventListener('click', function () {
    var ap = activePage();
    var idx = ap ? book.pages.indexOf(ap) + 1 : book.pages.length;
    addPage(idx, true);
  });
  trayBtn.addEventListener('click', function () { setTray(tray.hidden, true); });
  themeBtn.addEventListener('click', function () { applyTheme(isDark() ? 'light' : 'dark', true); });
  inkBar.addEventListener('click', function (e) {
    var btn = e.target.closest('.ink-dot');
    if (btn) applyInk(btn.dataset.ink, true);
  });
  coverBtn.addEventListener('click', function () { if (turnReady) $(flipbookEl).turn('page', 1); });
  prevBtn.addEventListener('click', function () { go(-1); });
  nextBtn.addEventListener('click', function () { go(1); });

  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (t && t.closest && t.closest('.photo, .thumb')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  });

  // Thả tệp ảnh lên trang hoặc dán ảnh bằng Ctrl+V
  function hasFiles(e) {
    var t = e.dataTransfer && e.dataTransfer.types;
    return !!t && Array.prototype.indexOf.call(t, 'Files') >= 0;
  }
  document.addEventListener('dragover', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    markDrop(e.clientX, e.clientY);
  });
  document.addEventListener('dragleave', function (e) {
    if (!hasFiles(e)) return;
    if (!e.relatedTarget) clearDrop();
  });
  document.addEventListener('drop', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    var t = targetAt(e.clientX, e.clientY);
    clearDrop();
    addFiles(e.dataTransfer.files, t ? pageById(t.dataset.pid) : activePage());
  });
  document.addEventListener('paste', function (e) {
    var cd = e.clipboardData;
    if (!cd) return;
    var imgs = [];
    if (cd.files && cd.files.length) {
      for (var i = 0; i < cd.files.length; i++) {
        if (/^image\//.test(cd.files[i].type)) imgs.push(cd.files[i]);
      }
    }
    if (imgs.length) {
      e.preventDefault();
      addFiles(imgs, activePage());
    }
  });

  var resizeTimer = 0;
  function scheduleLayout() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 80);
  }
  if (window.ResizeObserver) new ResizeObserver(scheduleLayout).observe(shelf);
  else window.addEventListener('resize', scheduleLayout);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(); });
  window.addEventListener('pagehide', flush);

  boot();
})(jQuery);
</script>
